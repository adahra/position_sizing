<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator SL &amp; TP (1% Risiko)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2>💰 Kalkulator Trading (Position Sizing)</h2>

        <label for="modal">Total Modal (Rupiah):</label>
        <input type="number" id="modal" value="962088" min="0.01" step="any" required>

        <label for="risiko">Batas Risiko Maksimal:</label>
        <select id="risiko">
            <option value="0.01">1% (Sangat Konservatif)</option>
            <option value="0.03">3% (Konservatif)</option>
        </select>
        
        <label for="hargaBeli">Harga Beli (Entry Price):</label>
        <input type="number" id="hargaBeli" min="0.01" step="any" required>

        <label for="atr">ATR (Jarak SL 2x ATR):</label>
        <input type="number" id="atr" min="0.01" step="any" required>

        <label for="riskReward">Rasio Risk-Reward (R:R):</label>
        <select id="riskReward">
            <option value="2">1:2</option>
            <option value="3">1:3</option>
        </select>

        <button type="button" onclick="hitungTrading()">Hitung Posisi &amp; Exit</button>

        <div class="result" id="hasil">
            <p class="centered">Masukkan data untuk memulai perhitungan.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
